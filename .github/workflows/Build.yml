name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          # For Linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: p2fmd
            asset_name: p2fmd-linux-amd64.elf
            script: build/script/linux/build.py
            script_command: binary

          # For Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: p2fmd.exe
            asset_name: p2fmd-windows-amd64.exe
            script: build/script/windows/build.py
            script_command: binary

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build asset
        run: >
          uv run --script ${{ matrix.script }}
          ${{ matrix.script_command }}
          --target ${{ matrix.target }}
          --bin-name ${{ matrix.bin_name }}
          --asset-name ${{ matrix.asset_name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.os }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Prepare source archive
        run: >
          uv run --script build/script/linux/build.py
          source-archive
          --output-dir dist
          --archive-name p2fmd-source.zip
          --ref ${{ github.sha }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
